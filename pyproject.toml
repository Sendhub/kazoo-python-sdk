[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazoo-api"
description = "SendHub Wrapper for the Kazoo API"
readme = "README.rst"
requires-python = ">=3.11"

# Tell PEP-621 that version is provided dynamically
dynamic = ["version"]

# Version is provided dynamically below via tool.setuptools.dynamic
authors = [
  { name = "SendHub", email = "support@sendhub.com" }
]
urls = { Home = "https://www.2600hz.com/" }
keywords = ["sendhub", "wrapper", "kazoo", "api", "http", "bindings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]
dependencies = ["requests>=2.32.5"]

# setuptools-specific config
[tool.setuptools.packages.find]
where = ["."]
include = ["kazoo", "kazoo.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
sendhub = ["VERSION", "*.txt", "*.md"]

# Dynamic version: read VERSION constant from sendhub/version.py
[tool.setuptools.dynamic.version]
attr = "kazoo.version.VERSION"
